<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body{
        font-family: arial,sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-color: #070505;
        margin: 0;
    }
    .card{
        width: 280px;
        background-color: rgb(196, 188, 188);
        border: 1px solid #0a0404;
        border-radius: 8px;
        padding: 15px;
        box-shadow: 0 4px 8px rgba(0, 0,0, 0.1);
    }
    .image{
        width: 100%;
        height: 200px;
        display: flex;
        overflow: hidden;
        border-radius: 6px;
    }
    image.img{
        width: 10%;
        height: 10%;
        object-fit: cover;
        transition: transform 0.4s ease;
    }
    .image:hover img{
        transform: scale(1.15);
    }
    .text{
        padding: 15px;
        text-align: center;
    }
    #title{
        font-size: 18px;
        font-weight: bold;
        margin-bottom: 5px;
    }
</style>
<body>
    <div class="card">
        <div class="image">
            <img src="https://img.magnific.com/free-photo/beautiful-rose-water_23-2150737341.jpg" alt="">
        </div>
<div class="text">
       <h3 id="title">beautiful rose</h3>
</div>
    </div>
</body>
</html>
