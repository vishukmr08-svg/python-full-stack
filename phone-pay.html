<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phone-pay</title>
</head>

<body>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            color: #24232a;
            background: white;
            /* padding-bottom: 65px; */
            display: flex;
            /* align-items: center; */
            /* justify-content: center; */
        }

        .navbar {
            height: 90px;
            padding: 0 5px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: white;
            box-shadow: 0 3px 8px #00000018;
            position: sticky;
            top: 1; 
        }

        .menu {
            color: #6739a6;
            font-size: 40px;
            cursor: pointer;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #54218d;
            font-size: 30px;
            font-weight: bold;
            text-decoration: none;
        }

        .logo-icon {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: #6739a6;
            color: white;
            display: grid;
            place-items: center;
            font-size: 30px;
        }

        .vishu {
            max-width: 1200px;
            margin: auto;
            padding: 55px 25px 80px;
            text-align: center;
        }

        .vishu-visual {
            height: 680px;
            max-width: 620px;
            margin: auto;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .mobile {
            width: 265px;
            height: 0px;
            border: 8px solid #242027;
            border-radius: 100%;

            position: relative;
            z-index: 2;
            padding: 43px 4px 48px;
            box-shadow: 0 0 0 2px #9c929f;
            align-items: center;
        }
    </style>

    <header>
        <section class="navbar">
            <nav>
                 <div class="menu">≡</div>
                <a href="#" class="logo">
                    <span class="logo-icon">पे</span>
                    <span>Phone-pay</span>
                </a>
            </nav>
        </section>
    </header>
    <section class="first">
        <div class="first-main">
            <div class="vishu-visual"></div>
            <div class="orbit"></div>
            <div class="floating-icon cart">🛒</div>
            <div class="floating-icon mobile">📱</div>
            <div class="floating-icon bag">🧳</div>
            <div class="floating-icon money">₹</div>
