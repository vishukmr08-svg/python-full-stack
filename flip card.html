<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body{
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0f172a;
        font-family: Arial,sans-serif;
        color: white;
    }
    .scene{
        width: 280px;
        height: 180px;
        perspective: 1000px;
    }
    .flip-card{
        width: 100%;
        height: 100%;
        position: relative;
        transform-style: preserve-3d;
        transition: transform 0.7s ease;
    }
    .scene:hover .flip-card{
        transform: rotateY(180deg);
    }
    .face{
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        border-radius: 18px;
        backface-visibility: hidden;
        background: linear-gradient(135deg,#7c3aed,#06b6d4);
        font-size: 24px;
        font-weight: bold;
    }
    .back{
        transform: rotateY(180deg);
        background: linear-gradient(135deg,#db2777,#7c3aed);
    }
</style>
<body>
    <div class="scene">
        <div class="flip-card">
            <div class="face">Front side</div>
            <div class="face back">Back Side</div>
        </div>
    </div>
</body>
</html>
