<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card</title>
</head>
<style>
    * {
        margin: 0%;
        padding: 0%;
    }

    .Card {
       width: 300px;
       margin: 50px;
       margin-left: 30%;
       text-align: center;
       font-family: Arial, Helvetica, sans-serif;
       box-shadow: 4px 8px o rgba(0, 0, 0, 0.2);
    }
    .Card:hover {
        box-shadow: 0 8px 16px 0 rgba(0, 0, 0, 0.2);
    }
    .image{
        height: 200px; 
        width: 200px;
        /* border: 2px solid; */
        text-align: center;
    }
   .image img{
        height: 400px;
        width: 300px;
          /* background-image: url("https://cdn.bikedekho.com/processedimages/indian/scout-bobber/source/scout-bobber68aea60c84a82.jpg?tr=w-880,h-495"); */
          
    }
    .text{
        text-align: center;
        margin-top: 200px;
        font-size: large;
    }
    .Card button{
        height: 50px;
        width: 100px;
        margin: 20px;
        font-size: larger;
        border-radius: 8px;
        background-color: rgb(75, 8, 8);
    }
</style>

<body>
    <div class="Card">
        <div class="image">
            <img src="https://cdn.bikedekho.com/processedimages/indian/scout-bobber/source/scout-bobber68aea60c84a82.jpg?tr=w-880,h-495" alt=""> 
          
        </div>
        <div class="text"><h1>Indian Scout Bobber</h1></div>
        <div class="button"></div>
        <button>Buy now</button>
    </div>
</body>

</html>
