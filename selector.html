<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    /* universal selector */
    h1 {
        /* element /tag selector */
        background-color: brown;
        color: beige;
    }

    #a1 {
        /* id selector */
        background-color: red;
        color: aqua;
    }

    #a2 {
        background-color: blueviolet;
        color: black;
    }

    #a3 {
        background-color: blueviolet;
        color: brown;
    }

    #a4 {
        background-color: chartreuse;
        color: brown;
    }

    a5 {
        background-color: chocolate;
        color: beige;
    }

    .s1 {
        /* class selector */
        background-color: cadetblue;
        color: chartreuse;
    }
</style>

<body>
    <h1 id="a1">css</h1>
    <h2 id="a2">css</h2>
    <h3 id="a3">css</h3>
    <h4 id="a4">css</h4>
    <h5 id="a5">css</h5>
    


</body>

</html>
