<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>imaghover</title>
</head>
<style>
    div{
        height: 200px;
        width: 200px; 
        display: flex;
        margin: 30px;
        /* padding: 50px; */
        gap: 40px;
    }
    div:hover{
       height: 205px;
       width: 205px;
       transition-property: all;
       transition-duration: 1s;
       transition-timing-function: ease;
       transition-delay: 0s;.
    }
    div:active{
        background-color: red;
        color: red;
        box-shadow: 0px 4px 8px rgba(0,0, 0, 0.1);
        box-sizing: border-box;
    
    }
</style>
<body>
    <div>
    <img src="https://www.industrialempathy.com/img/remote/ZiClJf-640w.avif" alt="">
    </div>
    <div>
        <img src="https://www.shutterstock.com/image-photo/woman-walks-barefoot-between-tropical-600w-2659184059.jpg" alt="">
    </div>
    
</body>
</html>
