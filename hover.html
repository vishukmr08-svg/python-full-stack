<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hover</title>
</head>
<style>
    div{
        transition: all 2s ease-in-out 1s;
    }
    div:hover{
        background-color: burlywood;
        margin-left: 500px;
        font-size: 50px;
        color: chocolate;
        padding: 50px;
    }
    div:active{
        background-color: chartreuse;
        color: red;
        /* height: 500px; */
        border-radius: 50%;
    }
</style>
<body>
    <div>Hello</div>
</body>
</html>
