<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body{
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: black;
    }
    button{
        position: relative;
        isolation: isolate;
        overflow: hidden;
        padding: 16px 32px;
        border: 2px solid #8b5cf6;
        border-radius: 12px;
        background: #17132c;
        font-size: 18px;
        cursor: pointer;
    }
    button::before{
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(110deg, transparent,#8b5cf6,transparent);
        transform: translate(-110%);
        transition: transform 0.5s ease;
        z-index: -1;
    }
    button:hover::before{
        transform: translate(0);
    }

</style>
<body>
    <button>Explore Project→</button>
</body>
</html>
