<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
     body{
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: rgb(36, 6, 48);
    }
   #text{
    width: 0;
    overflow: hidden;
    white-space: nowrap;
    color: aqua;
    font-size: 35px;
    border-right:3px solid #38bdf8 ;
    animation: typing 4s steps(20)forwards,
    cursor 0.7s step-end infinite;
   }
   @keyframes typing{
    from{
        width: 0;
    }
    to{
        width: 20ch;
    }
   }
   @keyframes cursor{
    50%{
        border-radius: transparent;
    }
   }
</style>
<body>
    <div id="text">
        I am a web devloper
    </div>
</body>
</html>
